name: LIFE 2.0 MVP Verify

on:
  push:
    branches:
      - mvp/life2-bootstrap
    paths:
      - 'life2-api/**'
      - 'life2-web/**'
      - '.github/workflows/life2-mvp-verify.yml'
  pull_request:
    paths:
      - 'life2-api/**'
      - 'life2-web/**'
      - '.github/workflows/life2-mvp-verify.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life2-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life2-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
