name: LIFE 2.0 MVP Verify

on:
  push:
    branches:
      - mvp/life2-bootstrap
    paths:
      - 'life2-api/**'
      - 'life2-web/**'
      - '.github/workflows/life2-mvp-verify.yml'
  pull_request:
    paths:
      - 'life2-api/**'
      - 'life2-web/**'
      - '.github/workflows/life2-mvp-verify.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life2-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life2-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  live-smoke:
    if: github.event_name == 'push'
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render dev deploy
        run: |
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 20 https://life2-api-dev.onrender.com/health || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"MVP-0.2.0"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Render dev API did not reach MVP-0.2.0 in time"
          exit 1
      - name: Verify Awareness catalog
        run: |
          BODY="$(curl -fsS --max-time 20 'https://life2-api-dev.onrender.com/v1/awareness/questions?household_type=couple')"
          echo "$BODY" | python -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] is True; assert d['data']['total']==12; assert len(d['data']['questions'])==12"
