name: LIFE 2.0 MVP Verify

on:
  push:
    branches:
      - mvp/life2-bootstrap
    paths:
      - 'life2-api/**'
      - 'life2-web/**'
      - '.github/workflows/life2-mvp-verify.yml'
  pull_request:
    paths:
      - 'life2-api/**'
      - 'life2-web/**'
      - '.github/workflows/life2-mvp-verify.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life2-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life2-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  live-smoke:
    if: github.event_name == 'push'
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render dev deploy with Supabase storage
        run: |
          for i in $(seq 1 36); do
            BODY="$(curl -fsS --max-time 20 https://life2-api-dev.onrender.com/health || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"MVP-0.3.0"' && echo "$BODY" | grep -q '"storage":"supabase"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Render dev API did not reach Supabase-backed MVP-0.3.0 in time"
          exit 1

      - name: Verify Awareness catalog
        run: |
          BODY="$(curl -fsS --max-time 20 'https://life2-api-dev.onrender.com/v1/awareness/questions?household_type=couple')"
          echo "$BODY" | python -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] is True; assert d['data']['total']==12; assert len(d['data']['questions'])==12"

      - name: Verify persistent Awareness full flow
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          BASE="https://life2-api-dev.onrender.com"

          def call(path, method="GET", data=None, headers=None):
              body=None if data is None else json.dumps(data).encode()
              h={"Content-Type":"application/json"}
              if headers: h.update(headers)
              req=urllib.request.Request(BASE+path,data=body,headers=h,method=method)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          questions=call("/v1/awareness/questions?household_type=couple")["data"]["questions"]
          created=call("/v1/awareness/runs","POST",{"age_band":"50_55","household_type":"couple"})["data"]
          run_id=created["run_id"]
          token=created["run_token"]
          headers={"X-Awareness-Token":token}

          for q in questions:
              saved=call(
                  f"/v1/awareness/runs/{run_id}/answers/{q['id']}",
                  "PUT",
                  {"response":"UNKNOWN_OR_NOT_PREPARED"},
                  headers,
              )
              assert saved["ok"] is True

          first=call(f"/v1/awareness/runs/{run_id}/complete","POST",None,headers)["data"]
          second=call(f"/v1/awareness/runs/{run_id}/complete","POST",None,headers)["data"]

          assert len(first["top3"])==3
          assert first["handoff_token"]
          assert second["handoff_token"]==first["handoff_token"]
          assert second.get("idempotent") is True
          print("PERSISTENCE_SMOKE_RUN_ID="+run_id)
          PY
