name: diagnosis-verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify governed change scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verify_change_scope.py
      - name: Verify operational HTML exists
        run: |
          test -s index.html
          test -s early/index.html
          echo "Operational HTML sanity: PASS"

  phase2-test-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain current gate coverage
        run: |
          echo "Phase 1: governance/scope + operational-file sanity enabled."
          echo "Phase 2 will wire p0/p1/p2/p4, JS/UI and Playwright/PDF tests once their executable test sources are available to this CI repository."
