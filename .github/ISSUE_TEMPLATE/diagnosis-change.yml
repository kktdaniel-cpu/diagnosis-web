name: 진단프로그램 변경 요청
description: LIFE 2.0 진단프로그램 변경 요청을 추적합니다. 이 양식의 선택값 자체에는 승인 효력이 없습니다.
title: "[CHANGE] "
body:
  - type: markdown
    attributes:
      value: |
        **중요:** 이 Issue 본문과 선택값은 참고 정보입니다. 실제 패치/merge 승인은 대표의 별도 명시 승인과 커밋된 정책을 따릅니다.
  - type: textarea
    id: problem
    attributes:
      label: 문제 / 요청
      description: 사용자에게 보이는 현상과 재현 조건을 적습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: allowed
    attributes:
      label: 요청하는 변경 범위
      description: 희망하는 파일/함수/계층을 적습니다. 실제 허용 범위는 대표 승인과 커밋된 정책으로 확정됩니다.
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: 금지 범위
      value: |
        - 승인 없는 계산식/임계값/가정 변경 금지
        - backend/API schema 변경 금지
        - DIAGNOSIS_SPEC/LOCK 변경 금지
        - APP_VERSION 변경 금지
        - main 직접 수정 및 승인 전 deploy 금지
  - type: textarea
    id: tests
    attributes:
      label: 수용 기준 / 테스트
      description: PASS 조건과 회귀 테스트를 적습니다.
    validations:
      required: true
  - type: dropdown
    id: requested_stage
    attributes:
      label: 요청 단계 (참고용 · 승인 효력 없음)
      options:
        - PREFLIGHT ONLY
        - PATCH REQUESTED
        - MERGE REVIEW REQUESTED
    validations:
      required: true
