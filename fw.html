<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life 2.0 · 외국인 금융 건전성 진단 (단독 실행본)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#124A2F;--g2:#1E6B45;--gold:#C9A449;--bg:#F5F7F5;--card:#fff;--ink:#121815;--mute:#6B7570;--line:#E1E6E3;--warn:#B4532B;--ok:#2E7D4F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR','Noto Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:900px){.app{max-width:760px}}
.top{background:var(--g);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.top .brand{font-weight:900;font-size:16px;letter-spacing:.2px}.top .brand small{display:block;font-weight:500;font-size:10px;opacity:.75;letter-spacing:1px}
.lang{display:flex;gap:4px}.lang button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:3px 9px;font-size:11px}.lang button.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:700}
.main{flex:1;padding:16px 16px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(18,74,47,.05)}
.hero{background:linear-gradient(135deg,#0F3B25,#1E6B45);color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:14px}
.hero .tag{display:inline-block;background:var(--gold);color:#1a1a1a;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.hero h1{font-size:22px;line-height:1.3;font-weight:900;margin-bottom:8px}.hero p{font-size:13px;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:17px;color:var(--g)}.kpi span{font-size:11px;color:var(--mute)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;background:var(--g);color:#fff}
.btn.sec{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.gold{background:var(--gold);color:#1a1a1a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row .btn{flex:1}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.step{font-size:11px;color:var(--mute);text-align:center;padding:6px 4px;border-radius:8px;background:#EDF1EE}
.step.on{background:var(--g);color:#fff;font-weight:700}.step.done{background:#CFE3D6;color:var(--g)}
.bar{height:6px;background:#E3E9E5;border-radius:999px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));width:0;transition:width .3s}
.qnum{font-size:12px;color:var(--mute);margin-bottom:6px}.qtext{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:14px}
.opts{display:grid;gap:8px}
@media(min-width:900px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;text-align:left;font-size:15px;display:flex;align-items:center;gap:10px;transition:.15s}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid #B9C4BD;flex:none}
.opt.on{border-color:var(--g);background:#EEF5F0}.opt.on .dot{border-color:var(--g);background:var(--g);box-shadow:inset 0 0 0 3px #fff}
.opt.multi .dot{border-radius:5px}
.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.prev{flex:0 0 96px}
.hint{font-size:12px;color:var(--mute);margin-top:10px}
.saved{font-size:11px;color:var(--ok);text-align:right;margin-top:8px;height:14px}
/* result */
.score{background:linear-gradient(135deg,#0F3B25,#1E6B45);color:#fff;border-radius:18px;padding:20px;display:flex;align-items:center;gap:18px;margin-bottom:12px}
.ring{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.ring b{font-size:30px;line-height:1}.ring small{font-size:10px;opacity:.8}
.score .ptitle{font-size:12px;opacity:.85}.score .pname{font-size:20px;font-weight:900;margin:2px 0 6px}.score .grade{display:inline-block;background:var(--gold);color:#1a1a1a;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px}
.axes{display:grid;gap:10px;margin:8px 0 4px}
.ax{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:13px}
.ax .track{height:10px;background:#E3E9E5;border-radius:999px;overflow:hidden}.ax .track i{display:block;height:100%;border-radius:999px;background:var(--g2)}
.ax b{text-align:right;color:var(--g)}
.comment{background:#EAF4EE;border-left:3px solid var(--g2);border-radius:8px;padding:12px 14px;font-size:14px;margin-top:12px}
.acts{display:grid;gap:8px;margin-top:8px}
.act{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}
.act .n{width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.act .t{flex:1;font-size:14px}.act .ax-tag{font-size:10px;color:var(--mute)}
.act .go{font-size:12px;color:var(--g);font-weight:700;white-space:nowrap}
.flag{background:#FFF4E5;border:1px solid #F3D9B0;color:#7A4A12;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px}
h3.sec{font-size:15px;color:var(--g);margin:18px 0 8px;padding-left:8px;border-left:3px solid var(--gold)}
.foot{font-size:11px;color:var(--mute);text-align:center;padding:14px}
.err{background:#FDECEA;color:#8B2A1E;border-radius:10px;padding:12px;font-size:13px;margin-bottom:12px}
.hidden{display:none!important}
.resume{background:#FFF9E8;border:1px solid #EFD9A0;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.resume button{border:0;background:var(--g);color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Life 2.0<small id="brandSub">FOREIGN WORKER · FINANCIAL HEALTH</small></div>
    <div class="lang" id="langBar"></div>
  </div>
  <div class="main">
    <div id="err" class="err hidden"></div>

    <!-- INTRO -->
    <section id="s-intro">
      <div id="resumeBox" class="resume hidden"><span id="resumeTxt"></span><button id="resumeBtn"></button></div>
      <div class="hero">
        <span class="tag" id="i_tag"></span>
        <h1 id="i_h1"></h1>
        <p id="i_p"></p>
      </div>
      <div class="kpis"><div class="kpi"><b>10</b><span id="i_k1"></span></div><div class="kpi"><b>3</b><span id="i_k2"></span></div><div class="kpi"><b>3</b><span id="i_k3"></span></div></div>
      <div class="card">
        <p id="i_desc" style="font-size:13.5px;color:#3A443E;margin-bottom:14px"></p>
        <button class="btn" id="startBtn"></button>
        <p class="hint" id="i_priv"></p>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="s-quiz" class="hidden">
      <div class="steps" id="steps"></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="card">
        <div class="qnum" id="qnum"></div>
        <div class="qtext" id="qtext"></div>
        <div class="opts" id="opts"></div>
        <div class="nav"><button class="btn sec prev" id="prevBtn"></button><button class="btn" id="nextBtn"></button></div>
        <div class="saved" id="savedMsg"></div>
      </div>
    </section>

    <!-- RESULT -->
    <section id="s-result" class="hidden">
      <div class="score">
        <div class="ring" id="ring"><div style="text-align:center"><b id="rTotal">0</b><small>/100</small></div></div>
        <div><div class="ptitle" id="r_ptitle"></div><div class="pname" id="rPersona"></div><span class="grade" id="rGrade"></span></div>
      </div>
      <div id="flags"></div>
      <div class="card">
        <h3 class="sec" style="margin-top:0" id="r_h_axes"></h3>
        <div class="axes" id="axes"></div>
        <div class="comment" id="rComment"></div>
        <h3 class="sec" id="r_h_acts"></h3>
        <div class="acts" id="acts"></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn sec" id="againBtn"></button><button class="btn gold" id="ctaBtn"></button></div>
      <p class="hint" id="r_note" style="text-align:center"></p>
    </section>
  </div>
  <div class="foot">© Life 2.0 (라이프이점영) · fw_fin_health_v1</div>
</div>

      labels:Object.fromEntries(['ax.FS','ax.IR','ax.RE','p.SAVER','p.REMIT_FOCUSED','p.RISK_EXPOSED','g.A','g.B','g.C','g.D'].map(k=>[k,t(lang,k)]))};

  function sel(ans,qid){ const a=ans[qid]; if(!a||a.idx==null||Array.isArray(a.idx)) return null; return QMAP[qid].options.find(o=>o.idx===a.idx)||null; }
  function sels(ans,qid){ const a=ans[qid]; if(!a) return []; let idxs=Array.isArray(a.idx)?a.idx:[a.idx]; return QMAP[qid].options.filter(o=>idxs.includes(o.idx)); }
  function p(ans,qid,key,def){ const o=sel(ans,qid); return o&&o.params[key]!==undefined?o.params[key]:def; }

  function buildCtx(ans){
    const q1=sel(ans,'Q1'); const visa=q1?q1.params:{visa_class:'other',eps:false,dtl_ins:false,np_refund:true};
    const stay_m=p(ans,'Q2','stay_m',24), stay_score=p(ans,'Q2','stay_score',65);
    const inc=p(ans,'Q4','inc',250), inc_score=p(ans,'Q4','inc_score',60);
    let remit_r=p(ans,'Q5','remit_r',0.4);
    const ch=sel(ans,'Q6'); const ch_val=ch?ch.value:'bank'; const ch_score=ch?ch.params.ch_score:60; const fee_r=ch?ch.params.fee_r:0.035;
    const freq_score=p(ans,'Q7','freq_score',55); const dep=p(ans,'Q8','dep',0);
    const ins_set=sels(ans,'Q9').map(o=>o.value);
    const living=clamp(inc*0.35,60,150);
    if(ch_val==='none') remit_r=0;
    const save_r=Math.max(0,1-remit_r-living/inc); const emerg_m=living?dep/living:0;
    return {visa,stay_m,stay_score,tenure_y:p(ans,'Q3','tenure_y',2),inc,inc_score,remit_r,remit_amt:inc*remit_r,ch_val,ch_score,fee_r,freq_score,dep,ins_set,living,save_r,emerg_m,
      dtl:p(ans,'Q10','dtl_score',null), np_know:p(ans,'Q10b','np_know',null)};
  }
  function scoreFS(c){ const em=c.emerg_m; const emerg=em>=6?35:em>=3?25:em>=1?15:em>0?5:0; const sr=c.save_r; const save=sr>=0.25?20:sr>=0.15?14:sr>=0.05?8:0;
    let fs=emerg+c.inc_score*0.25+save+c.stay_score*0.20; if(c.visa.visa_class==='perm'&&c.dep>=1000) fs+=5; return clamp(fs,0,100); }
  function scoreIR(c){ const ins=c.ins_set; let ins_pts=0; if(!ins.includes('unknown')) ins_pts=ins.reduce((s,v)=>s+({nhis:15,np:10,wci:10,ei:5}[v]||0),0);
    const indemn=ins.includes('indemn')?20:0; const regime=c.visa.dtl_ins?(c.dtl??0)*0.25:(c.np_know??0)*0.25; const em=c.emerg_m; const emin=em>=1?15:em>=0.5?8:0;
    let ir=ins_pts+indemn+regime+emin; if(c.visa.eps&&!ins.includes('wci')) ir-=10; if(c.visa.visa_class==='perm'&&!ins.includes('np')) ir-=5; return clamp(ir,0,100); }
  function optimalBand(m){ if(m<12) return [0.50,0.80]; if(m<36) return [0.35,0.60]; if(m<120) return [0.20,0.45]; return [0.05,0.30]; }
  function scoreRE(c){
    if(c.ch_val==='none'){ const ratio=c.stay_m>=120?40:24; return {ratio,channel:30,freq:20,cost:10,total:ratio+60,fee_year:0}; }
    const [lo,hi]=optimalBand(c.stay_m); const r=c.remit_r; const d=(lo<=r&&r<=hi)?0:Math.min(Math.abs(r-lo),Math.abs(r-hi));
    const ratio=d===0?40:d<=0.10?28:d<=0.20?16:6; const channel=c.ch_score*0.30; const freq=c.freq_score*0.20;
    const fee_year=c.remit_amt*12*c.fee_r; const cost=fee_year<=c.inc*0.05?10:fee_year<=c.inc*0.15?6:2;
    return {ratio,channel,freq,cost,total:clamp(ratio+channel+freq+cost,0,100),fee_year};
  }
  const grade=x=>x>=80?'A':x>=65?'B':x>=50?'C':'D';
  function assignPersona(FS,IR,RE,c){ const ins=c.ins_set;
    if(IR<45||(c.visa.eps&&!ins.includes('wci'))||ins.includes('unknown')) return 'RISK_EXPOSED';
    if(c.remit_r>=0.60&&FS<55) return 'REMIT_FOCUSED';
    if(FS>=65&&c.emerg_m>=3) return 'SAVER';
    const arr=[['FS',FS],['IR',IR],['RE',RE]].sort((a,b)=>a[1]-b[1]); return {FS:'REMIT_FOCUSED',IR:'RISK_EXPOSED',RE:'REMIT_FOCUSED'}[arr[0][0]]; }
  function personaComment(code,c,lang){
    const dep=c.dep,em=c.emerg_m,sm=c.stay_m,inc=c.inc,save5=inc*0.05,emf=em.toFixed(1);
    if(lang==='en'){
      if(code==='SAVER'){ const nxt=sm<36?'sorting out deposit maturities and remittance timing before departure':'reviewing pension and long-term savings products'; return `Your ₩${fmtMan(dep)}0,000 in Korean savings covers about ${emf} months of living costs. Next step: ${nxt}.`; }
      if(code==='REMIT_FOCUSED') return `Sending ₩${fmtMan(c.remit_amt)}0,000 a month is a big support for your family. But your Korean emergency fund covers only ${emf} months — job loss or illness could stop the transfers. Move just ₩${fmtMan(save5)}0,000 a month into a Korean savings account and you'll have ₩${fmtMan(save5*6)}0,000 in six months.`;
      const base=(c.visa.eps||c.visa.dtl_ins)?'The Departure Guarantee Insurance is paid by your employer and you must claim it yourself when you leave. Check your enrolment now. ':'Check your health-insurance status and the pension lump-sum refund / totalization rules for your country. ';

    }
    if(lang==='vi'){
      if(code==='SAVER') return `Tiết kiệm ${fmtMan(dep)} vạn won đủ cho khoảng ${emf} tháng sinh hoạt. Bước tiếp theo: ${sm<36?'sắp xếp đáo hạn và thời điểm chuyển tiền trước khi về nước':'xem xét sản phẩm hưu trí và tích lũy dài hạn'}.`;
      if(code==='REMIT_FOCUSED') return `Gửi ${fmtMan(c.remit_amt)} vạn won/tháng là hỗ trợ lớn cho gia đình, nhưng quỹ dự phòng ở Hàn Quốc chỉ đủ ${emf} tháng. Hãy dành ${fmtMan(save5)} vạn won/tháng vào tài khoản tiết kiệm Hàn Quốc — sau 6 tháng bạn sẽ có ${fmtMan(save5*6)} vạn won.`;
      const base=c.visa.dtl_ins?'Bảo hiểm mãn hạn xuất cảnh do chủ sử dụng đóng và bạn phải tự yêu cầu khi xuất cảnh. Hãy kiểm tra ngay. ':'Hãy kiểm tra bảo hiểm y tế và điều kiện hoàn trả lương hưu một lần / hiệp định BHXH. ';
      return base+(!c.ins_set.includes('indemn')?'Không có bảo hiểm y tế tư nhân, một lần nhập viện có thể tốn 150–300 vạn won.':'');
    }
    if(code==='SAVER'){ const nxt=sm<36?'출국 전 예·적금 만기와 송금 시점 정리':'연금·장기 적립 상품 검토'; return `국내 예금 ${fmtMan(dep)}만원은 생활비 약 ${emf}개월분입니다. 다음 단계는 ${nxt}입니다.`; }
    if(code==='REMIT_FOCUSED') return `송금 ${fmtMan(c.remit_amt)}만원/월은 가족에게 큰 힘입니다. 다만 국내 비상금이 ${emf}개월분이라 갑작스런 실직·질병 시 송금이 끊길 수 있습니다. 월 ${fmtMan(save5)}만원만 국내 적금으로 돌리면 6개월 후 비상금 ${fmtMan(save5*6)}만원이 됩니다.`;
    const base=c.visa.dtl_ins?'출국만기보험은 사업주가 의무 가입하며 출국 시 본인이 청구해야 받습니다. 지금 가입 여부를 확인하세요. ':'건강보험 가입 상태와 국민연금 반환일시금·사회보장협정 요건을 확인하세요. ';
    return base+(!c.ins_set.includes('indemn')?'실손보험이 없으면 입원 1회에 150~300만원 부담이 생길 수 있습니다.':'');
  }
  function topActions(c,scores,rep,lang,k=3){
    const cands=[]; const ins=c.ins_set;
    if(c.visa.dtl_ins&&(c.dtl||0)<75) cands.push([100-(c.dtl||0),'IR','IR_dgi']);
    if(!c.visa.dtl_ins&&(c.np_know||0)<100&&c.visa.np_refund) cands.push([60,'IR','IR_np']);
    if(c.visa.eps&&!ins.includes('wci')) cands.push([90,'IR','IR_wci']);
    if(!ins.includes('indemn')) cands.push([70,'IR','IR_indemn']);
    if(!ins.includes('nhis')&&!ins.includes('unknown')) cands.push([65,'IR','IR_nhis']);
    if(ins.includes('unknown')) cands.push([85,'IR','IR_nhis']);
    if(c.emerg_m<3) cands.push([80-c.emerg_m*10,'FS','FS_emerg']);
    if(c.stay_m<12&&['nonpro','other'].includes(c.visa.visa_class)) cands.push([40,'FS','FS_stay']);
    if(c.ch_val!=='none'){ if(rep.ratio<40) cands.push([55+(40-rep.ratio)/2,'RE','RE_ratio']); if(c.ch_val!=='fintech') cands.push([60,'RE','RE_channel']); if(c.freq_score<70) cands.push([45,'RE','RE_freq']); }
    const order=Object.entries(scores).sort((a,b)=>a[1]-b[1]); const picked=[]; const used=new Set();
    const byPr=[...cands].sort((a,b)=>b[0]-a[0]);
    for(const [ax] of order){ for(const cd of byPr){ if(cd[1]===ax&&!used.has(cd[2])){ picked.push(cd); used.add(cd[2]); break; } } }
    for(const cd of byPr){ if(picked.length>=k) break; if(!used.has(cd[2])){ picked.push(cd); used.add(cd[2]); } }
    let pk=picked.slice(0,k); if(!pk.length) pk=[[0,'FS','GEN_keep']];
    const [lo,hi]=optimalBand(c.stay_m); const fee_save=Math.max(0,c.remit_amt*12*(c.fee_r-0.010));
    const vars={save5:fmtMan(c.inc*0.05),lo:Math.round(lo*100),hi:Math.round(hi*100),fee_save:fmtMan(fee_save)};
    return pk.map((cd,i)=>{ const [title,ctype,target]=(D.actions[lang]||D.actions.ko)[cd[2]]; return {rank:i+1,axis:cd[1],key:cd[2],title:title.replace(/\{(\w+)\}/g,(_,v)=>vars[v]),cta:{type:ctype,target}}; });
  }
  function coherenceFlags(c,ans){

    if(c.ch_val==='none'&&p(ans,'Q5','remit_r',0)>=0.5) f.push({code:'F2',msg:'송금하지 않는다고 답했지만 송금 비율이 50% 이상입니다.'});

    if(c.ins_set.includes('unknown')&&c.ins_set.length>1) f.push({code:'F4',msg:"'잘 모름'과 다른 보험을 함께 선택했습니다."});

})();

window.FW_LOCAL = async function(path, opt={}){
  const body = opt.body ? JSON.parse(opt.body) : {};
  const url = new URL('http://x'+path); const p=url.pathname; const lang=url.searchParams.get('lang')||'ko';
  const KEY='fw_local_drafts'; const load=()=>JSON.parse(localStorage.getItem(KEY)||'{}'); const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
  const now=()=>new Date().toISOString();
  const visible=(ans)=>{ const q1=ans.Q1; const v1=q1?window.__FW_CAT__.questions[0].options[q1.idx]?.value:null; const dtl=v1==='E9'||v1==='H2';
    return window.__FW_CAT__.questions.filter(q=>!q.show_if?true:(v1==null?false:(q.show_if.eq?dtl:!dtl))).map(q=>q.id); };
  const state=(ans)=>{ const vis=visible(ans); const answered=vis.filter(q=>ans[q]!=null); const nxt=vis.find(q=>!answered.includes(q))||null;
    return {current_group:nxt?window.__FW_CAT__.questions.find(q=>q.id===nxt).group:'G3',current_q:nxt,answered,progress_pct:Math.round(answered.length/10*100)}; };
  if(p==='/health') return {ok:true,mode:'local'};
  if(p==='/questions') return FW.publicCatalog(lang);
  if(p==='/diagnose') return FW.diagnose(body.answers||{}, body.lang||'ko');
  if(p==='/drafts' && (opt.method||'GET')==='POST'){
    const all=load(); const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
    const d={draft_id:id,survey_id:'fw_fin_health_v1',survey_version:'1.0.0',partner:{code:body.partner_code||'DIRECT',member_ref:null,channel:body.channel||'web'},locale:body.locale||'ko',
      state:state({}),answers:{},timing:{started_at:now(),updated_at:now(),per_q_ms:{}},status:'draft'};
    all[id]=d; save(all); return d;
  }
  const m=p.match(/^\/drafts\/([^/]+)(\/complete)?$/);
  if(m){ const all=load(); const d=all[m[1]]; if(!d) throw new Error('draft not found');
    if(m[2]){ const st=state(d.answers); if(st.current_q) throw new Error('unanswered: '+st.current_q); const res=FW.diagnose(d.answers,lang||d.locale); d.status='completed'; d.result=res; save(all); return res; }
    if((opt.method||'GET')==='PATCH'){ for(const [k,v] of Object.entries(body.answers||{})){ if(v==null) delete d.answers[k]; else d.answers[k]={idx:v.idx}; }
      Object.assign(d.timing.per_q_ms, body.per_q_ms||{}); if(body.locale) d.locale=body.locale; d.timing.updated_at=now(); d.state=state(d.answers); save(all); return d; }
    return d;
  }
  throw new Error('unknown '+p);
};

  $('resumeBtn').textContent=T('resumeBtn');
  const lb=$('langBar'); lb.innerHTML='';
  ['ko','en','vi'].forEach(l=>{ const b=document.createElement('button'); b.textContent=l.toUpperCase(); b.className=l===lang?'on':''; b.onclick=()=>setLang(l); lb.appendChild(b); });
}
async function setLang(l){
  lang=l; renderStatic();
  try{ CAT = await api('/questions?lang='+lang); }catch(e){ errBox(T('err')); return; }
  if(!$('s-quiz').classList.contains('hidden')) renderQ();
  if(draft) api('/drafts/'+draft.draft_id,{method:'PATCH',body:JSON.stringify({answers:{},locale:lang})}).catch(()=>{});
}

/* ───── visibility / progress ───── */
function paramOf(qid){ return null; } // params는 서버 전용. show_if는 값 기반으로 프론트에서 근사 계산
function computeVisible(){
  // Q10 (dtl_ins=true) : Q1 value E9/H2 ; Q10b : 그 외.  (서버 카탈로그의 show_if를 값 매핑으로 처리)
  const q1 = answers.Q1; const v1 = q1!=null ? CAT.questions[0].options[q1.idx]?.value : null;
  const dtl = v1==='E9'||v1==='H2';
  visible = CAT.questions.filter(q=>{
    if(!q.show_if) return true;
    if(v1==null) return false;
    return q.show_if.eq ? dtl : !dtl;
  }).map(q=>q.id);
}
function answeredCount(){ return visible.filter(id=>answers[id]!=null).length; }
function renderProgress(){
  const q = CAT.questions.find(x=>x.id===visible[qi]);
  const st=$('steps'); st.innerHTML='';
  CAT.groups.forEach(g=>{
    const d=document.createElement('div'); d.className='step';
    const gi=CAT.groups.indexOf(g), ci=CAT.groups.findIndex(x=>x.id===q.group);
    if(gi<ci) d.classList.add('done'); if(gi===ci) d.classList.add('on');
    d.textContent=(gi+1)+'. '+g.title; st.appendChild(d);
  });
  $('barFill').style.width = Math.round(answeredCount()/CAT.total_questions*100)+'%';
}

/* ───── quiz ───── */
function renderQ(){
  computeVisible();
  if(qi>=visible.length) qi=visible.length-1;
  const qid=visible[qi], q=CAT.questions.find(x=>x.id===qid);
  renderProgress();
  $('qnum').textContent = `Q${qi+1} / ${CAT.total_questions}` + (q.type==='multi' ? ' · '+T('sel') : '');
  $('qtext').textContent = q.text;
  const box=$('opts'); box.innerHTML='';
  const cur = answers[qid];
  q.options.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'+(q.type==='multi'?' multi':'');
    const on = q.type==='multi' ? (cur&&Array.isArray(cur.idx)&&cur.idx.includes(o.idx)) : (cur&&cur.idx===o.idx);
    if(on) b.classList.add('on');
    b.innerHTML = `<span class="dot"></span><span>${o.label}</span>`;
    b.onclick = ()=>pick(q,o);
    box.appendChild(b);
  });
  $('prevBtn').disabled = qi===0;
  const last = qi===visible.length-1;
  $('nextBtn').textContent = last ? T('done') : T('next');
  $('nextBtn').disabled = answers[qid]==null;
  tStart=Date.now();
}
function pick(q,o){
  if(q.type==='multi'){
    let arr = (answers[q.id]&&Array.isArray(answers[q.id].idx)) ? [...answers[q.id].idx] : [];
    if(o.exclusive){ arr = arr.includes(o.idx)?[]:[o.idx]; }
    else { arr = arr.filter(i=>!q.options.find(x=>x.idx===i)?.exclusive); arr = arr.includes(o.idx)?arr.filter(i=>i!==o.idx):[...arr,o.idx]; }
    if(arr.length) answers[q.id]={idx:arr}; else delete answers[q.id];
    renderQ(); return;
  }
  answers[q.id]={idx:o.idx};
  if(q.id==='Q1'){ delete answers.Q10; delete answers.Q10b; }
  renderQ();
  setTimeout(()=>next(), 180);
}
async function saveDraft(qid){
  if(!draft) return;
  const per={}; if(qid) per[qid]=Date.now()-tStart;
  try{
    const payload={answers:{}, per_q_ms:per, locale:lang};
    CAT.questions.forEach(q=>{ payload.answers[q.id]= answers[q.id]||null; });
    draft = await api('/drafts/'+draft.draft_id,{method:'PATCH',body:JSON.stringify(payload)});
    localStorage.setItem(LS_KEY, JSON.stringify({id:draft.draft_id, lang}));
    $('savedMsg').textContent='✓ '+T('saved'); setTimeout(()=>$('savedMsg').textContent='',1500);
  }catch(e){}
}
async function next(){
  const qid=visible[qi];
  if(answers[qid]==null) return;
  saveDraft(qid);
  if(qi<visible.length-1){ qi++; renderQ(); return; }
  await finish();
}
function prev(){ if(qi>0){qi--; renderQ();} }

async function finish(){
  $('nextBtn').disabled=true;
  try{
    let res;
    if(draft){ await saveDraft(); res = await api('/drafts/'+draft.draft_id+'/complete?lang='+lang,{method:'POST'}); }
    else res = await api('/diagnose',{method:'POST',body:JSON.stringify({answers,lang})});
    localStorage.removeItem(LS_KEY);
    renderResult(res); show('s-result');
  }catch(e){ errBox(T('err')+' ('+e.message+')'); $('nextBtn').disabled=false; }
}

/* ───── result ───── */
function renderResult(r){
  errBox(null);
  const s=r.scores;
  $('rTotal').textContent=s.total;
  const deg=Math.round(s.total*3.6);
  $('ring').style.background=`conic-gradient(#C9A449 ${deg}deg, rgba(255,255,255,.18) ${deg}deg)`;
  $('ring').style.boxShadow='inset 0 0 0 10px #124A2F';
  $('rPersona').textContent=r.persona.name;
  $('rGrade').textContent=`${s.grade} · ${s.grade_label}`;
  const ax=$('axes'); ax.innerHTML='';
  ['FS','IR','RE'].forEach(k=>{
    const d=document.createElement('div'); d.className='ax';
    d.innerHTML=`<span>${s.labels[k]}</span><div class="track"><i style="width:${s[k]}%"></i></div><b>${s[k]}</b>`; ax.appendChild(d);
  });
  $('rComment').textContent=r.persona.comment;
  const ac=$('acts'); ac.innerHTML='';
  r.actions.forEach(a=>{
    const d=document.createElement('div'); d.className='act';
    d.innerHTML=`<div class="n">${a.rank}</div><div class="t">${a.title}<div class="ax-tag">${s.labels[a.axis]||''}</div></div><div class="go">›</div>`;
    d.onclick=()=>onCta(a); ac.appendChild(d);
  });
  const fl=$('flags'); fl.innerHTML='';
  (r.flags||[]).forEach(f=>{ const d=document.createElement('div'); d.className='flag'; d.textContent='⚠ '+f.msg; fl.appendChild(d); });
  window.__lastResult=r;
}
function onCta(a){
  // 파트너 앱 연동 훅: 인앱 WebView에서는 postMessage로 전달, 웹은 URL 파라미터로 이동
  const msg={type:'fw_cta',cta:a.cta,axis:a.axis,key:a.key};
  if(window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  else if(window.parent!==window) window.parent.postMessage(msg,'*');
  else console.log('CTA',msg);
}

/* ───── boot ───── */
async function start(resume){
  errBox(null);
  try{
    if(!CAT) CAT=await api('/questions?lang='+lang);
    if(!resume){
      draft = await api('/drafts',{method:'POST',body:JSON.stringify({partner_code:PARTNER,member_uid:MEMBER,channel:window.parent!==window?'inapp':'web',locale:lang,platform:/Android|iPhone/i.test(navigator.userAgent)?'mobile':'web'})});
      answers = draft.answers||{}; // 회원 기준 기존 draft가 있으면 이어짐
      localStorage.setItem(LS_KEY, JSON.stringify({id:draft.draft_id, lang}));
    }
    computeVisible();
    qi = Math.max(0, visible.findIndex(id=>answers[id]==null)); if(qi<0) qi=0;
    show('s-quiz'); renderQ();
  }catch(e){ errBox(T('err')+' ('+e.message+')'); }
}
async function tryResume(){
  const saved=localStorage.getItem(LS_KEY); if(!saved) return;
  try{
    const {id}=JSON.parse(saved);
    const d=await api('/drafts/'+id);
    if(d.status!=='draft') { localStorage.removeItem(LS_KEY); return; }
    draft=d; answers=d.answers||{};
    $('resumeTxt').textContent=T('resume').replace('{p}',d.state.progress_pct);
    $('resumeBox').classList.remove('hidden');
    $('resumeBtn').onclick=()=>start(true);
  }catch(e){ localStorage.removeItem(LS_KEY); }
}
$('startBtn').onclick=()=>{ draft=null; answers={}; qi=0; start(false); };
$('nextBtn').onclick=next; $('prevBtn').onclick=prev;
$('againBtn').onclick=()=>{ draft=null; answers={}; qi=0; show('s-intro'); };
$('ctaBtn').onclick=()=>onCta({cta:{type:'consult',target:'life20_consult'},axis:'ALL',key:'CTA'});
renderStatic();
api('/questions?lang='+lang).then(c=>{CAT=c;}).catch(()=>errBox(T('err')));
tryResume();
</script>
<script>
(function(){ var _rr=window.renderResult;
window.renderResult=function(r){
  try{ localStorage.setItem('l2p_fw_last', JSON.stringify({ts:Date.now(), title:'외국인 금융 건전성 진단 · Financial Health Check',
    summary:(r&&r.scores? (r.scores.total+'점 · '+(r.scores.grade||'')+' '+(r.scores.grade_label||'')) : '')+(r&&r.persona&&r.persona.name?(' · '+r.persona.name):'')})); }catch(e){}
  return _rr.apply(this,arguments);
}; })();
</script>
