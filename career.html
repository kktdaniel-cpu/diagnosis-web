<style>
:root{--g:#124A2F;--g2:#1E6B45;--gold:#C9A449;--bg:#F5F7F5;--ink:#121815;--mute:#6B7570;--line:#E1E6E3;--red:#B4532B;--amber:#C48A1D;--green:#2E7D4F}

body{font-family:'Noto Sans KR','Noto Sans','Noto Sans SC','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}

.main{flex:1;padding:16px 16px 28px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(18,74,47,.05)}
.hero{background:linear-gradient(135deg,#0F3B25,#1E6B45);color:#fff;border-radius:18px;padding:22px 20px;margin-bottom:14px}

.hero h1{font-size:21px;line-height:1.35;font-weight:900;margin-bottom:8px;white-space:pre-line}.hero p{font-size:13px;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:17px;color:var(--g)}.kpi span{font-size:11px;color:var(--mute)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;background:var(--g);color:#fff}.btn.sec{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.gold{background:var(--gold);color:#1a1a1a}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row .btn{flex:1}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.step{font-size:10.5px;color:var(--mute);text-align:center;padding:6px 3px;border-radius:8px;background:#EDF1EE;line-height:1.25}.step.on{background:var(--g);color:#fff;font-weight:700}.step.done{background:#CFE3D6;color:var(--g)}

.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.qnum{font-size:12px;color:var(--mute);margin-bottom:6px}.qtext{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:12px;flex:1}
.tipbtn{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);background:#FFF9E8;color:#8A6A18;font-weight:900;font-size:14px;margin-top:2px}
.tip{display:none;background:#FFF9E8;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#4a3d1c;margin-bottom:12px}.tip.on{display:block}.tip b{color:#8A6A18;display:block;font-size:11px;margin-bottom:2px}
.opts{display:grid;gap:8px}@media(min-width:900px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;text-align:left;font-size:14.5px;display:flex;align-items:center;gap:10px}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid #B9C4BD;flex:none}.opt.on{border-color:var(--g);background:#EEF5F0}.opt.on .dot{border-color:var(--g);background:var(--g);box-shadow:inset 0 0 0 3px #fff}.opt.multi .dot{border-radius:5px}
.nav{display:flex;gap:10px;margin-top:18px}.nav .btn{flex:1}.nav .btn.prev{flex:0 0 96px}
.hint{font-size:12px;color:var(--mute);margin-top:10px}.saved{font-size:11px;color:var(--green);text-align:right;margin-top:8px;height:14px}
.lvl{border-radius:18px;padding:20px;color:#fff;margin-bottom:12px}.lvl.GREEN{background:linear-gradient(135deg,#0F3B25,#2E7D4F)}.lvl.AMBER{background:linear-gradient(135deg,#6B4A0B,#C48A1D)}.lvl.RED{background:linear-gradient(135deg,#5A2412,#B4532B)}
.lvl .t{font-size:12px;opacity:.85}.lvl .n{font-size:26px;font-weight:900;margin:2px 0 6px}.lvl .s{font-size:13px;opacity:.95}

table.f27{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}table.f27 th{background:#EDF1EE;color:var(--g);font-weight:700;padding:6px 8px;text-align:left}table.f27 td{border-bottom:1px solid var(--line);padding:6px 8px}table.f27 td.n{text-align:right}table.f27 tr.tot td{font-weight:700;background:#F7F9F7}
.f27sum{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}.f27sum b{color:var(--g);font-size:16px}
.gaps{display:grid;gap:8px;margin-top:8px}.gap{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px}.gap .n{width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}.gap .t{flex:1;font-size:14px}.gap .k{font-size:10.5px;color:var(--mute)}
.route{background:#EAF4EE;border-left:3px solid var(--g2);border-radius:8px;padding:12px 14px;font-size:14px;margin-top:8px;font-weight:500}
.flag{background:#FDECEA;border:1px solid #F1C4BC;color:#7A2A1E;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:8px}
h3.sec{font-size:15px;color:var(--g);margin:18px 0 8px;padding-left:8px;border-left:3px solid var(--gold)}
.foot{font-size:11px;color:var(--mute);text-align:center;padding:14px}.hidden{display:none!important}

<script>
/* 장기 체류·커리어 정착 진단 — 채점 엔진 */
const LS = (function(){
  const CAT = window.LS_CAT, POL = window.LS_POLICY, I = window.LS_I18N;
  const QMAP = Object.fromEntries(CAT.questions.map(q=>[q.id,q]));
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const R=x=>Math.floor(x+0.5);
  const T=(lang,k)=> (I[lang]||I.ko)[k] ?? I.ko[k] ?? k;
  const fmt=(s,v)=>s.replace(/\{(\w+)\}/g,(_,k)=>v[k]??'');

  function sel(ans,qid){ const a=ans[qid]; if(!a||Array.isArray(a.idx)) return null; return QMAP[qid].opts[a.idx]||null; }
  function sels(ans,qid){ const a=ans[qid]; if(!a) return []; const ix=Array.isArray(a.idx)?a.idx:[a.idx]; return ix.map(i=>QMAP[qid].opts[i]).filter(Boolean); }
  const P=(ans,q,k,d)=>{ const o=sel(ans,q); return o&&o.p[k]!==undefined?o.p[k]:d; };

  function ctx(ans){
    const v=sel(ans,'Q1'); const visa=v?v.p:{visa_class:'other',vs_base:45,work:'partial'}; const visa_v=v?v.v:'OTHER';
    const bonus=sels(ans,'Q12').filter(o=>!o.p.exclusive).reduce((s,o)=>s+o.p.b,0);
    const c={visa,visa_v,rem_m:P(ans,'Q2','rem_m',18),rem_score:P(ans,'Q2','rem_score',85),tenure_y:P(ans,'Q3','tenure_y',2),emp:P(ans,'Q4','emp',70),
      edu_pt:P(ans,'Q5','edu_pt',20),edu_kr:P(ans,'Q5','edu_kr',0),edu_lv:P(ans,'Q5','edu_lv',2),major_pt:P(ans,'Q6','major_pt',4),age_pt:P(ans,'Q7','age_pt',20),
      kor_pt:P(ans,'Q8','kor_pt',0),kor_lv:P(ans,'Q8','kor_lv',0),inc_pt:P(ans,'Q9','inc_pt',6),inc:P(ans,'Q9','inc',3500),tax_pt:P(ans,'Q10','tax_pt',0),tax_flag:!!P(ans,'Q10','tax_flag',false),
      goal:P(ans,'Q11','goal','long'),bonus_pt:Math.min(bonus,POL.max.bonus)};
    c.items={edu:c.edu_pt+c.edu_kr,major:c.major_pt,age:c.age_pt,kor:c.kor_pt,inc:c.inc_pt,tax:Math.max(0,c.tax_pt),bonus:c.bonus_pt};
    c.pts=Object.values(c.items).reduce((a,b)=>a+b,0)+(c.tax_flag?c.tax_pt:0);
    return c;
  }
  function scoreVS(c){
    let vs=c.visa.vs_base*0.40+c.rem_score*0.30+(c.visa.visa_class==='perm'?30:c.emp*0.30);
    if(c.visa.visa_class==='student'&&c.rem_m<6) vs-=10;
    if(c.visa.visa_class==='pro'&&c.emp<=30) vs-=20;
    if(c.tax_flag) vs-=10;
    return clamp(vs,0,100);
  }
  function scoreFT(c){
    if(c.visa.visa_class==='perm') return 100;
    if(c.visa.visa_class==='resid') return clamp(85+Math.min(15,c.tenure_y*3),0,100);
    const ratio=clamp(c.pts/POL.pass_line,0,1.25);
    let ft=70*Math.min(ratio,1)+15*(c.tenure_y>=1?1:0)+15*(c.inc>=POL.gni_ref?1:0);
    if(c.kor_pt===0) ft-=10; if(c.tax_flag) ft-=15;
    return clamp(ft,0,100);
  }
  function scoreEC(c){
    const ec=(c.edu_pt+c.edu_kr+c.major_pt)/43*30 + c.kor_pt/20*25 + c.emp*0.15 + Math.min(c.tenure_y,5)/5*10 + c.bonus_pt/15*20;
    return clamp(ec,0,100);
  }
  function hardFlags(c){
    const f=[]; if(c.tax_flag) f.push('flag_arrears'); if(c.rem_m<3) f.push('flag_rem');
    if(c.visa.visa_class==='pro'&&c.emp<=30) f.push('flag_e7_job');
    if(c.visa.visa_class==='student'&&c.rem_m<6&&c.emp<=60&&c.goal!=='short') f.push('flag_d2_grad');
    return f;
  }
  function classify(VS,FT,EC,flags,c){
    const arr=c.goal==='short'?[VS,EC]:[VS,FT,EC]; const mn=Math.min(...arr);
    if(flags.length||mn<40) return 'RED';
    if(mn<65||(['long','perm'].includes(c.goal)&&c.pts<POL.pass_line&&c.visa.visa_class!=='resid'&&c.visa.visa_class!=='perm')) return 'AMBER';
    return 'GREEN';
  }
  function gaps(c,lang){
    const M=POL.max; const eff={kor:1,tax:1,bonus:1,inc:2,edu:3};
    const cands=[];
    for(const k of Object.keys(eff)){ const gap=M[k]-c.items[k]; if(gap>0) cands.push({key:k,gap,pr:gap/eff[k]}); }
    cands.sort((a,b)=>b.pr-a.pr);
    const out=cands.slice(0,3).map(g=>{
      let text; const k=g.key;
      if(k==='kor'){ if(c.kor_lv===0) text=fmt(T(lang,'gap_kor0'),{pts:10}); else { const next=Math.min(6,c.kor_lv+1); const table={2:5,3:10,4:14,5:17,6:20}; text=fmt(T(lang,'gap_kor'),{cur:c.kor_lv,next,pts:(table[next]||20)-c.kor_pt}); } }
      else if(k==='tax') text=fmt(T(lang,'gap_tax'),{pts:Math.min(5,g.gap)});
      else if(k==='bonus') text=fmt(T(lang,'gap_bonus'),{pts:Math.min(5,g.gap)});
      else if(k==='inc'){ const steps=[[2500,3],[3500,6],[4500,10],[6000,14],[8000,18]]; const nx=steps.find(s=>s[0]>c.inc)||steps[4]; text=fmt(T(lang,'gap_inc'),{n:nx[0].toLocaleString(),pts:nx[1]-c.inc_pt}); }
      else text=fmt(T(lang,'gap_edu'),{pts:Math.min(10,g.gap)});
      return {key:k,label:T(lang,'it_'+k),gap:g.gap,text};
    });
    return out.length?out:[{key:'none',label:'',gap:0,text:T(lang,'gap_none')}];
  }
  function diagnose(ans,lang){
    const c=ctx(ans); const VS=scoreVS(c),FT=scoreFT(c),EC=scoreEC(c);
    const flags=hardFlags(c); const level=classify(VS,FT,EC,flags,c);
    const M=POL.max; const items=['edu','major','age','kor','inc','tax','bonus'].map(k=>({key:k,label:T(lang,'it_'+k),cur:c.items[k],max:M[k],gap:M[k]-c.items[k]}));
    const short=Math.max(0,POL.pass_line-c.pts);
    const visaLabel=(I[lang]||I.ko).o.Q1[c.visa_v]||c.visa_v;
    return {policy:POL.version,lang,level,level_label:T(lang,'lv_'+level),
      scores:{VS:R(VS),FT:R(FT),EC:R(EC),labels:{VS:T(lang,'ax_VS'),FT:T(lang,'ax_FT'),EC:T(lang,'ax_EC')}},
      work_limited:['partial','intern','limited'].includes(c.visa.work),
      summary:fmt(T(lang,'sum'),{visa:visaLabel,ten:c.tenure_y,pts:c.pts,short:short?fmt(T(lang,'sum_short'),{n:short}):T(lang,'sum_pass')}),
      f27:{items,total:c.pts,pass:POL.pass_line,short},
      gaps:gaps(c,lang), route:T(lang,'route_'+c.visa_v), goal:c.goal, goal_label:T(lang,'goal_'+c.goal),
      flags:flags.map(k=>({code:k,msg:T(lang,k)}))};
  }
  return {diagnose,T,fmt,CAT,langs:Object.keys(I)};
})();

</script>
<script>
const LS_KEY='ls_career_draft_v1'; const PARTNER=new URLSearchParams(location.search).get('partner')||'DIRECT';
let lang=new URLSearchParams(location.search).get('lang')||(navigator.language||'ko').slice(0,2); if(!LS_I18N[lang]) lang='ko';
const T=k=>LS.T(lang,k); const $=id=>document.getElementById(id);
let answers={}, qi=0, order=[];
LS.CAT.groups.forEach(g=>order.push(...g.qs));
const show=id=>{['s-intro','s-quiz','s-result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0);};
function renderStatic(){
  document.documentElement.lang=lang; $('brandSub').textContent=T('app_sub'); document.title='Life 2.0 · '+T('app_title'); $('polv').textContent=LS_POLICY.version;
  [['i_tag','hero_tag'],['i_h1','hero_h1'],['i_p','hero_p'],['i_k1','k1'],['i_k2','k2'],['i_k3','k3'],['i_desc','desc'],['i_priv','priv'],['startBtn','start'],['prevBtn','prev'],['resumeBtn','resumeBtn'],
   ['r_lvl_t','r_level'],['r_h_axes','r_axes'],['r_h_f27','r_f27'],['r_h_gaps','r_gaps'],['r_h_route','r_route'],['againBtn','r_again'],['ctaBtn','r_cta'],['r_note','r_note'],['th_item','col_item'],['th_cur','col_cur'],['th_max','col_max'],['th_gap','col_gap'],['tipTitle','why']]
   .forEach(([id,k])=>{$(id).textContent=T(k);});
  const lb=$('langBar'); lb.innerHTML=''; LS.langs.forEach(l=>{const b=document.createElement('button');b.textContent=l.toUpperCase();b.className=l===lang?'on':'';b.onclick=()=>{lang=l;renderStatic();if(!$('s-quiz').classList.contains('hidden'))renderQ();if(!$('s-result').classList.contains('hidden'))renderResult(LS.diagnose(answers,lang));};lb.appendChild(b);});
}
function renderQ(){
  const qid=order[qi], q=LS.CAT.questions.find(x=>x.id===qid), gi=LS.CAT.groups.findIndex(g=>g.qs.includes(qid));
  const st=$('steps'); st.innerHTML=''; LS.CAT.groups.forEach((g,i)=>{const d=document.createElement('div');d.className='step'+(i<gi?' done':i===gi?' on':'');d.textContent=(i+1)+'. '+T('grp_'+g.key);st.appendChild(d);});
  $('barFill').style.width=Math.round(Object.keys(answers).length/order.length*100)+'%';
  $('qnum').textContent=`Q${qi+1} / ${order.length}`+(q.type==='multi'?' · '+T('sel'):'');
  $('qtext').textContent=LS_I18N[lang].q[qid]||LS_I18N.ko.q[qid]; $('tipText').textContent=LS_I18N[lang].tip[qid]||LS_I18N.ko.tip[qid]; $('tip').classList.remove('on');
  const box=$('opts'); box.innerHTML=''; const cur=answers[qid];
  q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(q.type==='multi'?' multi':'');
    const on=q.type==='multi'?(cur&&cur.idx.includes(i)):(cur&&cur.idx===i); if(on)b.classList.add('on');
    b.innerHTML=`<span class="dot"></span><span>${(LS_I18N[lang].o[qid]||LS_I18N.ko.o[qid])[o.v]||LS_I18N.ko.o[qid][o.v]}</span>`; b.onclick=()=>pick(q,i,o); box.appendChild(b);});
  $('prevBtn').disabled=qi===0; $('nextBtn').textContent=qi===order.length-1?T('done'):T('next'); $('nextBtn').disabled=answers[qid]==null;
}
function pick(q,i,o){
  if(q.type==='multi'){ let arr=answers[q.id]?[...answers[q.id].idx]:[]; if(o.p.exclusive){arr=arr.includes(i)?[]:[i];} else {arr=arr.filter(x=>!q.opts[x].p.exclusive); arr=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i];}
    if(arr.length)answers[q.id]={idx:arr}; else delete answers[q.id]; renderQ(); save(); return; }
  answers[q.id]={idx:i}; renderQ(); save(); setTimeout(next,180);
}
function save(){ localStorage.setItem(LS_KEY,JSON.stringify({answers,qi,lang,ts:Date.now()})); $('savedMsg').textContent='✓ '+T('saved'); setTimeout(()=>$('savedMsg').textContent='',1500); }
function next(){ if(answers[order[qi]]==null)return; if(qi<order.length-1){qi++;renderQ();return;} finish(); }
function prev(){ if(qi>0){qi--;renderQ();} }
function finish(){ const r=LS.diagnose(answers,lang); localStorage.removeItem(LS_KEY); renderResult(r); show('s-result'); if(window.LS_ON_RESULT) try{window.LS_ON_RESULT(r,answers);}catch(e){} }
function renderResult(r){
  const lv=$('lvl'); lv.className='lvl '+r.level; $('rLevel').textContent=r.level_label; $('rSummary').textContent=r.summary;
  const fl=$('flags'); fl.innerHTML=''; r.flags.forEach(f=>{const d=document.createElement('div');d.className='flag';d.textContent='⚠ '+f.msg;fl.appendChild(d);});
  const ax=$('axes'); ax.innerHTML=''; ['VS','FT','EC'].forEach(k=>{const d=document.createElement('div');d.className='ax';d.innerHTML=`<span>${r.scores.labels[k]}</span><div class="track"><i style="width:${r.scores[k]}%"></i></div><b>${r.scores[k]}</b>`;ax.appendChild(d);});
  $('workBadge').classList.toggle('hidden',!r.work_limited); $('workBadge').textContent='⚠ '+T('work_badge');
  const tb=$('f27body'); tb.innerHTML=''; r.f27.items.forEach(it=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${it.label}</td><td class="n">${it.cur}</td><td class="n">${it.max}</td><td class="n" style="color:${it.gap>0?'#B4532B':'#2E7D4F'}">${it.gap>0?'-'+it.gap:'✓'}</td>`;tb.appendChild(tr);});
  const tr=document.createElement('tr'); tr.className='tot'; tr.innerHTML=`<td>${T('total')}</td><td class="n">${r.f27.total}</td><td class="n">${r.f27.items.reduce((s,i)=>s+i.max,0)}</td><td></td>`; tb.appendChild(tr);
  $('f27pass').textContent=`${T('pass')} ${r.f27.pass}`; $('f27short').textContent=r.f27.short?`${T('short')} ${r.f27.short}`:T('passed');
  const gp=$('gaps'); gp.innerHTML=''; r.gaps.forEach((g,i)=>{const d=document.createElement('div');d.className='gap';d.innerHTML=`<div class="n">${i+1}</div><div class="t">${g.text}${g.label?`<div class="k">${g.label}${g.gap?' · -'+g.gap:''}</div>`:''}</div>`;gp.appendChild(d);});
  $('route').textContent='🧭 '+r.route+'  ('+r.goal_label+')';
}
$('startBtn').onclick=()=>{answers={};qi=0;show('s-quiz');renderQ();};
$('nextBtn').onclick=next; $('prevBtn').onclick=prev; $('tipBtn').onclick=()=>$('tip').classList.toggle('on');
$('againBtn').onclick=()=>{answers={};qi=0;show('s-intro');};
$('ctaBtn').onclick=()=>{const msg={type:'ls_cta',partner:PARTNER,result:LS.diagnose(answers,lang)}; if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify(msg)); else if(window.parent!==window)window.parent.postMessage(msg,'*'); else console.log('CTA',msg);};
renderStatic();
(function(){ const s=localStorage.getItem(LS_KEY); if(!s)return; try{const d=JSON.parse(s); if(!d.answers||!Object.keys(d.answers).length)return; $('resumeTxt').textContent=T('resume').replace('{p}',Math.round(Object.keys(d.answers).length/order.length*100)); $('resumeBox').classList.remove('hidden'); $('resumeBtn').onclick=()=>{answers=d.answers;qi=Math.min(d.qi||0,order.length-1);show('s-quiz');renderQ();};}catch(e){} })();
</script>
<script>
window.LS_ON_RESULT=function(r,answers){
  try{ localStorage.setItem('l2p_career_last', JSON.stringify({ts:Date.now(), title:'장기 체류·커리어 정착 진단 · Long-stay & Career Check',
    summary:(r? ((r.level_label||'')+' · F-2-7 '+(r.f27&&r.f27.total!==undefined?r.f27.total+'점':'')) : '')})); }catch(e){}
};
