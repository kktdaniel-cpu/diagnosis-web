<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 제휴 감수 전 시안이다. 주소를 아는 사람만 열 수 있게 검색 수집을 막는다.
     정식 공개할 때 이 줄을 지우면 된다. -->
<meta name="robots" content="noindex,nofollow">
<title>웰다잉 준비도 진단 — 강사 학습 · 시연용</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --gd:#0E3A26; --g:#1C7A4E; --g2:#3E9A6B; --cream:#FAF8F3; --line:#E4E8E5;
  --ink:#16241D; --soft:#5E6B63; --mute:#98A19B;
  --warn:#C89A3C; --bad:#C2564B; --gold:#C9A227;
  --pad:18px;
}
html,body{margin:0;padding:0;background:#EFF2F0;color:var(--ink);
  font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕',sans-serif;line-height:1.6;
  -webkit-text-size-adjust:100%;}
.wrap{max-width:860px;margin:0 auto;background:#fff;min-height:100vh;
  box-shadow:0 0 40px rgba(0,0,0,.06);}
.ribbon{background:#8A6A20;color:#fff;font-size:12px;font-weight:700;text-align:center;
  padding:7px 14px;letter-spacing:-.01em;word-break:keep-all;}
.top{background:linear-gradient(135deg,var(--gd) 0%,#155C3B 58%,var(--g) 100%);color:#fff;
  padding:22px var(--pad) 20px;}
.top .kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
  letter-spacing:.06em;background:rgba(255,255,255,.16);border-radius:20px;padding:5px 11px;}
.top h1{margin:12px 0 6px;font-size:23px;font-weight:900;letter-spacing:-.04em;line-height:1.32;word-break:keep-all;}
.top p{margin:0;font-size:13.5px;color:rgba(255,255,255,.82);word-break:keep-all;}
.body{padding:var(--pad);}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:#fff;}
h2{font-size:18px;font-weight:900;letter-spacing:-.03em;margin:0 0 8px;word-break:keep-all;}
h3{font-size:15px;font-weight:900;letter-spacing:-.03em;margin:0 0 7px;word-break:keep-all;}
p.lead{font-size:13.5px;color:var(--soft);margin:0 0 12px;word-break:keep-all;}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:inherit;letter-spacing:-.02em;}
.btn.p{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.btn.s{background:#F2F6F3;color:var(--gd);border:1px solid #CBDCD1;}
.btn+.btn{margin-top:9px;}
.modes{display:grid;gap:10px;}
.mode{border:2px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;background:#fff;
  text-align:left;font-family:inherit;width:100%;}
.mode.on{border-color:var(--g);background:#F7FBF8;}
.mode b{display:block;font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.03em;}
.mode span{display:block;font-size:12.5px;color:var(--soft);margin-top:4px;line-height:1.55;word-break:keep-all;}
.mode .tag{display:inline-block;font-size:10.5px;font-weight:900;border-radius:20px;padding:2px 8px;
  background:#E6F4EC;color:#146B44;margin-bottom:6px;}
/* 진행 */
.pbar{height:6px;background:#EDF1EE;border-radius:4px;overflow:hidden;margin-bottom:6px;}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));transition:width .3s;}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:14px;}
.qsec{display:inline-block;font-size:11px;font-weight:900;background:#EEF4F0;color:#2F6B4C;
  border-radius:20px;padding:4px 10px;margin-bottom:10px;}
.qtx{font-size:20px;font-weight:900;letter-spacing:-.035em;line-height:1.42;margin:0 0 14px;word-break:keep-all;}
.opts{display:grid;gap:8px;}
.opt{border:1.6px solid var(--line);border-radius:13px;padding:14px 15px;cursor:pointer;background:#fff;
  font-family:inherit;text-align:left;font-size:15px;font-weight:600;color:var(--ink);line-height:1.5;
  word-break:keep-all;display:flex;align-items:center;gap:11px;}
.opt:hover{border-color:#BFD0C6;}
.opt.on{border-color:var(--g);background:#F2F8F4;font-weight:800;}
.opt .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--mute);}
.opt.on .n{background:var(--g);border-color:var(--g);color:#fff;}
.opt .sc{margin-left:auto;flex:0 0 auto;font-size:11.5px;font-weight:900;color:var(--mute);}
.nav{display:flex;gap:9px;margin-top:14px;}
.nav button{flex:1;border-radius:13px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;
  font-family:inherit;border:1px solid #CBDCD1;background:#F2F6F3;color:var(--gd);}
.nav button.p{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:0;}
.nav button:disabled{opacity:.4;cursor:default;}
/* 학습 패널 */
.learn{margin-top:14px;border:1px dashed #CBD8D0;border-radius:14px;background:#F8FBF9;padding:14px;}
.learn .h{font-size:11px;font-weight:900;color:#2F6B4C;letter-spacing:.04em;margin-bottom:5px;}
.learn .b{font-size:13px;color:var(--soft);line-height:1.66;word-break:keep-all;}
.learn .b + .h{margin-top:12px;}
.learn .src{display:inline-block;font-size:10.5px;font-weight:900;border-radius:20px;padding:2px 8px;margin-left:6px;}
.src.main{background:#E6F4EC;color:#146B44;} .src.new{background:#FBF3E0;color:#8A6A20;}
.cert{display:inline-block;font-size:11.5px;font-weight:800;color:#8A6A20;background:#FBF3E0;
  border-radius:20px;padding:3px 9px;margin-top:8px;}
/* 결과 */
.score{background:linear-gradient(135deg,var(--gd),#155C3B 60%,var(--g));color:#fff;border-radius:18px;
  padding:22px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto;}
.ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg);}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.ring .n b{font-size:30px;font-weight:900;letter-spacing:-.05em;}
.ring .n i{font-size:11px;font-style:normal;opacity:.75;margin-top:3px;}
.score .t{flex:1 1 210px;min-width:0;}
.score .t .lv{font-size:21px;font-weight:900;letter-spacing:-.04em;margin-bottom:5px;word-break:keep-all;}
.score .t p{margin:0;font-size:13.5px;color:rgba(255,255,255,.8);word-break:keep-all;}
.bars{margin-top:14px;display:grid;gap:9px;}
.bar{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:10px;}
.bar .nm{font-size:13px;font-weight:800;color:var(--ink);word-break:keep-all;}
.bar .tr{height:11px;background:#EDF1EE;border-radius:6px;overflow:hidden;}
.bar .tr i{display:block;height:100%;border-radius:6px;background:var(--g);}
.bar.warn .tr i{background:var(--warn);} .bar.bad .tr i{background:var(--bad);}
.bar .v{font-size:13.5px;font-weight:900;text-align:right;}
.bar.warn .v{color:#8A6A20;} .bar.bad .v{color:#9E3B32;}
.rec{border:1px solid var(--line);border-left:3px solid var(--g);border-radius:14px;padding:14px 15px;margin-top:10px;}
.rec.warn{border-left-color:var(--warn);} .rec.bad{border-left-color:var(--bad);}
.rec .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.rec .hd b{font-size:15px;font-weight:900;letter-spacing:-.03em;}
.rec .hd .sc{font-size:12px;font-weight:900;border-radius:20px;padding:2px 9px;background:#EEF1EF;color:var(--soft);}
.rec.warn .hd .sc{background:#FBF3E0;color:#8A6A20;} .rec.bad .hd .sc{background:#FBEAE8;color:#9E3B32;}
.rec .now{font-size:14px;font-weight:800;color:#12301F;background:#F2F8F4;border-radius:10px;
  padding:10px 12px;margin-bottom:8px;word-break:keep-all;}
.rec .wh{font-size:12.5px;color:var(--soft);line-height:1.65;word-break:keep-all;margin-bottom:9px;}
.rec .as{border-top:1px dashed #E0E6E2;padding-top:9px;}
.rec .as .t{font-size:11px;font-weight:900;color:#8A6A20;letter-spacing:.03em;margin-bottom:5px;}
.rec .as ul{margin:0;padding-left:16px;} .rec .as li{font-size:12.5px;color:var(--soft);line-height:1.6;
  word-break:keep-all;margin:2px 0;}
.rec .biz{display:inline-block;font-size:10.5px;font-weight:900;color:#2F6B4C;background:#EEF4F0;
  border-radius:20px;padding:2px 8px;margin-top:7px;}
.note{font-size:11.5px;color:var(--mute);line-height:1.7;word-break:keep-all;margin-top:14px;
  border-top:1px solid var(--line);padding-top:12px;}
.note b{color:var(--soft);}
.calc{margin-top:12px;}
.calc table{width:100%;border-collapse:collapse;font-size:12px;}
.calc th,.calc td{border-bottom:1px solid #EDF1EE;padding:7px 6px;text-align:left;}
.calc th{background:#F7FAF8;font-weight:900;color:var(--soft);font-size:11px;}
.calc td.r{text-align:right;font-weight:800;}
.calc .tot td{border-top:1.6px solid #CBDCD1;font-weight:900;color:#12301F;}
.pill{display:inline-block;font-size:10.5px;font-weight:900;border-radius:20px;padding:2px 7px;}
.pill.main{background:#E6F4EC;color:#146B44;} .pill.new{background:#FBF3E0;color:#8A6A20;}
.hide{display:none!important;}
/* 시연 모드 — 강의장 뒤에서도 보이게 */
body.show .qtx{font-size:26px;}
body.show .opt{font-size:18px;padding:17px 18px;}
body.show .top h1{font-size:26px;}
body.show .score .t .lv{font-size:24px;}
@media (min-width:720px){
  :root{--pad:26px;}
  .top h1{font-size:28px;} .qtx{font-size:23px;}
  body.show .qtx{font-size:31px;}
  .modes{grid-template-columns:1fr 1fr;}
}
@media print{
  body{background:#fff;} .wrap{box-shadow:none;max-width:100%;}
  .nav,.btn,.mode,.learn,.ribbon{display:none!important;}
  .card{break-inside:avoid;}
}
</style></head>

  function calc(){
    var bySec={}, list=[];
    SEC.forEach(function(s){ bySec[s[0]]=[]; });

      var a=ans[q.id];
      if(a===undefined||a===null) return;
      var s=q.opts[a][1];
      bySec[q.sec].push(s);
      list.push({id:q.id, sec:q.sec, src:q.src, ref:q.ref||'', pick:q.opts[a][0], s:s});

    var secScore={}, vals=[];

      var arr=bySec[s[0]];

      secScore[s[0]]=v; if(v!==null) vals.push(v);
    });
    var total=vals.length?Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length):0;
    /* 본 진단 웰다잉 축과 같은 5문항만으로 낸 값 — 두 도구가 어긋나지 않는지 대조용 */
    var mainOnly=list.filter(function(x){ return x.src==='main'; });
    var wellAxis=mainOnly.length
      ? Math.round(mainOnly.reduce(function(a,b){return a+b.s;},0)/mainOnly.length) : null;
    return { total:total, sec:secScore, list:list, wellAxis:wellAxis, answered:list.length };

      +'<p class="lead">같은 문항이지만 화면이 달라집니다. 강의 중에도 상단에서 바꿀 수 있습니다.</p>'
      +'<div class="modes">'
        +'<button class="mode'+(mode==='learn'?' on':'')+'" data-m="learn">'
          +'<span class="tag">강사용</span><b>학습 모드</b>'
          +'<span>문항마다 출제 의도 · 배점 근거 · 강의에서 짚을 점이 함께 보입니다. '
          +'보기 옆에 배점도 표시됩니다. 결과 화면에 계산 내역이 그대로 나옵니다.</span></button>'
        +'<button class="mode'+(mode==='show'?' on':'')+'" data-m="show">'
          +'<span class="tag">강의장용</span><b>시연 모드</b>'
          +'<span>글씨가 커지고 해설과 배점이 숨겨집니다. 수강생 앞에서 바로 진단해 '
          +'결과를 보여 줄 때 쓰세요.</span></button>'
      +'</div>'
      +'<button class="btn p" id="goStart" style="margin-top:14px;">진단 시작 — 15문항 · 약 3분</button>'
      +'</div>'
      +'<div class="card"><h3>이 도구가 재는 것</h3>'
      +'<p class="lead" style="margin-bottom:10px;">5개 영역 15문항으로 <b>웰다잉 준비도</b>를 봅니다. '
      +'각 영역이 협회 자격 과정과 어디서 만나는지도 함께 표시됩니다.</p>'
      + SEC.map(function(s){
          var n=Q.filter(function(q){return q.sec===s[0];}).length;
          return '<div class="bar" style="grid-template-columns:104px 1fr;margin-bottom:6px;">'
            +'<span class="nm">'+s[1]+'</span>'
            +'<span style="font-size:12.5px;color:var(--soft);word-break:keep-all;">'+s[2]+' · '+n+'문항</span></div>';
        }).join('')
      +'<div class="note"><b>점수 기준에 대해</b> — 15문항 중 5문항은 「2막1장」 본 진단의 '
      +'웰다잉 축 문항(Q36 · Q37 · Q38 · Q39 · Q43)을 <b>문안과 배점까지 그대로</b> 가져온 것입니다. '
      +'나머지 10문항은 협회 자격 과정의 주제로 이 도구를 위해 새로 만든 문항이며, 화면에 '
      +'<span class="pill new">신규</span> 로 표시됩니다. '
      +'여기서 나오는 <b>웰다잉 준비도</b>는 본 진단의 종합 점수(100점)와는 다른 별도 지표입니다.</div>'
      +'</div>';
    [].forEach.call(document.querySelectorAll('.mode'), function(b){
      b.onclick=function(){ mode=b.getAttribute('data-m'); document.body.className=(mode==='show'?'show':''); renderStart(); };
    });
    $('goStart').onclick=function(){ cur=0; $('scStart').className='hide'; $('scQuiz').className=''; renderQ(); };
  }

  /* ── 문항 화면 ─────────────────────────────────────────────────────── */
  function renderQ(){
    var q=Q[cur], picked=ans[q.id];
    var pct=Math.round((cur+1)/Q.length*100);
    var h='<div class="card">'
      +'<div class="pbar"><i style="width:'+pct+'%"></i></div>'
      +'<div class="pmeta"><span>'+(cur+1)+' / '+Q.length+'</span><span>'+pct+'%</span></div>'
      +'<span class="qsec">'+secName(q.sec)+'</span>'
      +(mode==='learn'?'<span class="src '+q.src+'" style="margin-left:6px;">'
        +(q.src==='main'?('본 진단 '+q.ref+' 동일'):'신규 문항')+'</span>':'')
      +'<p class="qtx">'+q.q+'</p><div class="opts">'
      + q.opts.map(function(o,i){
          return '<button class="opt'+(picked===i?' on':'')+'" data-i="'+i+'">'
            +'<span class="n">'+(i+1)+'</span><span>'+o[0]+'</span>'
            +(mode==='learn'?'<span class="sc">'+o[1]+'점</span>':'')+'</button>';
        }).join('')
      +'</div>';
    if(mode==='learn'){
      h+='<div class="learn">'
        +'<div class="h">출제 의도 · 배점 근거</div><div class="b">'+q.why+'</div>'
        +'<div class="h">강의에서 짚을 점</div><div class="b">'+q.teach+'</div>'
        +'<span class="cert">연결 자격 · 사업 : '+q.cert+'</span>'
        +'</div>';
    }
    h+='<div class="nav">'
      +'<button id="bPrev"'+(cur===0?' disabled':'')+'>← 이전</button>'
      +'<button id="bNext" class="p">'+(cur===Q.length-1?'결과 보기':'다음 →')+'</button>'
      +'</div></div>';
    $('scQuiz').innerHTML=h;
    [].forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick=function(){
        ans[q.id]=parseInt(b.getAttribute('data-i'),10);
        renderQ();
        /* 시연 모드는 고르면 바로 넘어간다 — 강의 흐름이 끊기지 않게 */
        if(mode==='show') setTimeout(next, 260);
      };
    });
    $('bPrev').onclick=function(){ if(cur>0){ cur--; renderQ(); window.scrollTo({top:0}); } };
    $('bNext').onclick=next;
    window.scrollTo({top:0});
  }
  function next(){
    var q=Q[cur];
    if(ans[q.id]===undefined){ alert('보기를 하나 골라 주세요.'); return; }
    if(cur<Q.length-1){ cur++; renderQ(); window.scrollTo({top:0}); }
    else { $('scQuiz').className='hide'; $('scResult').className=''; renderResult(); window.scrollTo({top:0}); }
  }

  /* ── 결과 화면 ─────────────────────────────────────────────────────── */
  function renderResult(){
    var R=calc(), lv=level(R.total);
    var C=2*Math.PI*46;
    var h='<div class="card"><div class="score">'
      +'<div class="ring"><svg viewBox="0 0 104 104">'
        +'<circle cx="52" cy="52" r="46" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="9"/>'
        +'<circle cx="52" cy="52" r="46" fill="none" stroke="#7FD6A6" stroke-width="9" stroke-linecap="round"'
        +' stroke-dasharray="'+(R.total/100*C).toFixed(1)+' '+C.toFixed(1)+'"/></svg>'
        +'<div class="n"><b>'+R.total+'</b><i>웰다잉 준비도</i></div></div>'
      +'<div class="t"><div class="lv">'+lv[0]+'</div><p>'+lv[1]+'</p></div></div>'
      +'<div class="bars">'
      + SEC.map(function(s){
          var v=R.sec[s[0]]; if(v===null) return '';
          return '<div class="bar '+cls(v)+'"><span class="nm">'+s[1]+'</span>'
            +'<span class="tr"><i style="width:'+Math.min(100,v)+'%"></i></span>'
            +'<span class="v">'+v+'</span></div>';
        }).join('')
      +'</div></div>';

    /* 협회 사업 연결 — 점수가 낮은 영역부터 */
    var order=SEC.slice().sort(function(a,b){ return (R.sec[a[0]]||0)-(R.sec[b[0]]||0); });
    h+='<div class="card"><h2>지금 무엇부터 하면 되나</h2>'
      +'<p class="lead">점수가 낮은 영역부터 정리했습니다. 각 항목은 <b>대한웰다잉협회의 교육 · 문화 · 복지 사업</b>과 '
      +'이어집니다. 금융상품 안내는 들어 있지 않습니다.</p>';
    order.forEach(function(s){
      var v=R.sec[s[0]]; if(v===null) return;
      var L=LINK[s[0]], c=cls(v);
      h+='<div class="rec '+c+'"><div class="hd"><b>'+s[1]+'</b>'
        +'<span class="sc">'+v+'점</span></div>'
        +'<div class="now">오늘 할 수 있는 것 — '+L.now+'</div>'
        +'<div class="wh">'+L.where+'</div>'
        +'<div class="as"><div class="t">협회에서 이어갈 수 있는 과정</div><ul>'
        + L.assoc.map(function(x){ return '<li>'+x+'</li>'; }).join('')
        +'</ul><span class="biz">'+L.biz+'</span></div></div>';
    });
    h+='<div class="note">※ 이 결과는 <b>참고용 자가진단</b>입니다. 의료 · 법률 자문이 아니며, '
      +'사전연명의료의향서 등록과 호스피스 이용은 공적 제도로 <b>비용이 들지 않습니다</b>. '
      +'유언 · 상속처럼 자산 구성에 따라 달라지는 부분은 전문가와 상의하세요.</div></div>';

    /* 학습 모드 — 계산 내역을 그대로 보여준다 */
    if(mode==='learn'){
      h+='<div class="card calc"><h2>계산 내역</h2>'
        +'<p class="lead">강사가 수강생 질문에 답할 수 있도록 점수가 어떻게 나왔는지 그대로 폅니다.</p>'
        +'<table><thead><tr><th>문항</th><th>고른 답</th><th style="text-align:right;">배점</th></tr></thead><tbody>';
      SEC.forEach(function(s){
        var rows=R.list.filter(function(x){ return x.sec===s[0]; });
        if(!rows.length) return;
        h+='<tr><th colspan="3" style="background:#F2F8F4;color:#146B44;">'+s[1]+'</th></tr>';
        rows.forEach(function(x){
          h+='<tr><td>'+x.id+' <span class="pill '+x.src+'">'
            +(x.src==='main'?x.ref:'신규')+'</span></td>'
            +'<td style="color:var(--soft);">'+x.pick+'</td>'
            +'<td class="r">'+x.s+'</td></tr>';
        });
        h+='<tr><td colspan="2" style="color:var(--soft);">└ '+s[1]+' 평균</td>'
          +'<td class="r">'+R.sec[s[0]]+'</td></tr>';
      });
      h+='<tr class="tot"><td colspan="2">웰다잉 준비도 = 5개 영역 평균</td><td class="r">'+R.total+'</td></tr>'
        +'</tbody></table>'
        +'<div class="note"><b>본 진단과의 관계</b> — 위 표에서 '
        +'<span class="pill main">Q36</span> 처럼 표시된 5문항은 「2막1장」 본 진단의 웰다잉 축과 '
        +'문안 · 배점이 같습니다. 그 5문항만으로 계산하면 '
        +'<b>'+(R.wellAxis===null?'—':R.wellAxis+'점')+'</b> 이고, 이 값은 본 진단 리포트의 '
        +'<b>웰다잉 점수</b>와 일치합니다. '
        +'<span class="pill new">신규</span> 문항은 이 도구에만 있으므로 본 진단 점수에는 들어가지 않습니다.</div>'
        +'</div>';
    }

    h+='<div class="card"><button class="btn p" onclick="window.print()">📄 결과 인쇄 · PDF 저장</button>'
      +'<button class="btn s" id="bAgain">다시 하기</button>'
      +'<button class="btn s" id="bMode">'+(mode==='learn'?'시연 모드로 보기':'학습 모드로 보기')+'</button></div>';

    $('scResult').innerHTML=h;
    $('bAgain').onclick=function(){ ans={}; cur=0; $('scResult').className='hide'; $('scStart').className=''; renderStart(); window.scrollTo({top:0}); };
    $('bMode').onclick=function(){ mode=(mode==='learn'?'show':'learn');
      document.body.className=(mode==='show'?'show':''); renderResult(); window.scrollTo({top:0}); };
  }

  /* 테스트에서 쓸 수 있게 열어둔다 */
  window.wdCalc=calc;
  window.wdSet=function(o){ ans=o; };
  window.wdGet=function(){ return ans; };
  window.wdMode=function(m){ if(m){ mode=m; document.body.className=(m==='show'?'show':''); } return mode; };
  window.wdGo=function(view){
    if(view==='result'){ $('scStart').className='hide'; $('scQuiz').className='hide'; $('scResult').className=''; renderResult(); }
    else if(view==='quiz'){ $('scStart').className='hide'; $('scResult').className='hide'; $('scQuiz').className=''; renderQ(); }
    else { $('scQuiz').className='hide'; $('scResult').className='hide'; $('scStart').className=''; renderStart(); }
  };
  window.wdQ=Q; window.wdSEC=SEC;

  renderStart();
})();
</script>
</body></html>
